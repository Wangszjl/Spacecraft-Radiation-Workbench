name: Worker transport

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'engine/**'
      - 'src/**'
      - 'app/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/projects/**'
      - 'ci/worker-linux.yml'
      - 'tools/check_worker_runtime.py'
      - 'tools/prepare_worker_runtime.py'
      - 'tools/check_cli_runtime.py'
      - 'tools/check_results_runtime.py'
      - 'tools/check_scan_runtime.py'
      - 'tools/check_voxel_runtime.py'
      - 'tools/check_pstar_dose.py'
      - 'tools/check_importance_runtime.py'
      - 'tools/enable_importance.py'
      - 'tools/run_importance_scan.py'
      - 'tools/compare_importance_scans.py'
      - 'tools/run_energy_response.py'
      - 'tools/check_energy_response_scaling.py'
      - 'tools/stratified_tid.py'
      - 'tools/stratified_study.py'
      - 'tools/check_partition_study_runtime.py'
      - 'tools/check_native_partition.py'
      - 'tools/generate_ae8ap8_example.py'
      - 'tools/ae8ap8_ephemeris.py'
      - 'tools/check_ae8ap8_example.py'
      - 'tools/check_binned_device_response.py'
      - 'tools/check_target_fluence.py'
      - 'src/DeviceResponse.cpp'
      - 'include/spacerad/DeviceResponse.h'
      - 'docs/DEVICE_RESPONSE.md'
      - 'examples/device-response/**'
      - 'examples/orbit-consumer/**'
      - 'examples/ephemerides/**'
      - 'examples/partition-consumer/**'
      - 'examples/projects/voxel-scoring.json'
      - 'examples/scans/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'src/**'
      - 'app/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/projects/**'
      - 'ci/worker-linux.yml'
      - 'tools/check_worker_runtime.py'
      - 'tools/prepare_worker_runtime.py'
      - 'tools/check_cli_runtime.py'
      - 'tools/check_results_runtime.py'
      - 'tools/check_scan_runtime.py'
      - 'tools/check_voxel_runtime.py'
      - 'tools/check_pstar_dose.py'
      - 'tools/check_importance_runtime.py'
      - 'tools/enable_importance.py'
      - 'tools/run_importance_scan.py'
      - 'tools/compare_importance_scans.py'
      - 'tools/run_energy_response.py'
      - 'tools/check_energy_response_scaling.py'
      - 'tools/stratified_tid.py'
      - 'tools/stratified_study.py'
      - 'tools/check_partition_study_runtime.py'
      - 'tools/check_native_partition.py'
      - 'tools/generate_ae8ap8_example.py'
      - 'tools/ae8ap8_ephemeris.py'
      - 'tools/check_ae8ap8_example.py'
      - 'tools/check_binned_device_response.py'
      - 'tools/check_target_fluence.py'
      - 'src/DeviceResponse.cpp'
      - 'include/spacerad/DeviceResponse.h'
      - 'docs/DEVICE_RESPONSE.md'
      - 'examples/device-response/**'
      - 'examples/orbit-consumer/**'
      - 'examples/ephemerides/**'
      - 'examples/partition-consumer/**'
      - 'examples/projects/voxel-scoring.json'
      - 'examples/scans/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Linux / Geant4 11.4.3
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Worker dependencies
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: ci/worker-linux.yml
          init-shell: bash
          cache-environment: false
          cache-downloads: false
          post-cleanup: all
      - name: Record resolved package identities
        run: |
          mkdir -p build/worker-evidence
          micromamba list --explicit > build/worker-evidence/packages-explicit.txt
          micromamba list --json > build/worker-evidence/packages.json
      - name: Configure headless Worker
        run: >-
          cmake -S . -B build/worker-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          -DSPACERAD_BUILD_SERVICES=ON -DSPACERAD_BUILD_DESKTOP=OFF
          -DSPACERAD_BUILD_WORKER=ON -DBUILD_TESTING=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_VTK=ON
      - name: Build Worker, services and tests
        run: cmake --build build/worker-ci --parallel 2
      - name: Test model and service contracts
        run: >-
          ctest --test-dir build/worker-ci --output-on-failure --no-tests=error
          --output-junit worker-tests.xml --parallel 2
      - name: Prepare audited dataset mapping
        run: >-
          python tools/prepare_worker_runtime.py
          --worker build/worker-ci/scdat_radiation_worker
          --prefix "$CONDA_PREFIX" --output-dir build/worker-runtime
      - name: Run real transport and service acceptance
        run: >-
          python tools/check_worker_runtime.py
          --runtime build/worker-runtime/runtime.json
          --service-test build/worker-ci/test_service_runtime
          --output-dir build/worker-acceptance
      - name: Verify target fluence and local response with real transport
        run: >-
          python tools/check_target_fluence.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/target-fluence-acceptance
      - name: Run public CLI integration acceptance
        run: >-
          python tools/check_cli_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/cli-acceptance
      - name: Run saved-result and shielding-comparison acceptance
        run: >-
          python tools/check_results_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/results-acceptance
      - name: Run fixed-cavity shielding scan acceptance
        run: >-
          python tools/check_scan_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --service-test build/worker-ci/test_scan_runtime
          --output-dir build/scan-acceptance
      - name: Run real voxel scoring and conservation acceptance
        run: >-
          python tools/check_voxel_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/voxel-acceptance
      - name: Compare silicon proton dose with NIST PSTAR
        run: >-
          python tools/check_pstar_dose.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/pstar-acceptance
      - name: Verify full-spectrum importance sampling
        run: >-
          python tools/check_importance_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/importance-acceptance
      - name: Verify narrow-band energy responses and fluence scaling
        run: |
          python tools/run_energy_response.py run --cli build/worker-ci/spacerad_cli --project examples/projects/spacecraft-tid-assembly.json --settings examples/scans/spacecraft-bus-thickness.json --runtime build/worker-runtime/runtime.json --output-dir build/energy-response-acceptance --histories 2000 --parallel 2
          python tools/run_energy_response.py inspect --cli build/worker-ci/spacerad_cli --runtime build/worker-runtime/runtime.json --output-dir build/energy-response-acceptance
          python tools/check_energy_response_scaling.py --study-dir build/energy-response-acceptance --cli build/worker-ci/spacerad_cli --runtime build/worker-runtime/runtime.json --output-dir build/energy-scaling-acceptance
      - name: Verify full-spectrum partition stability and archive rejection
        run: >-
          python tools/check_partition_study_runtime.py
          --cli build/worker-ci/spacerad_cli
          --runtime build/worker-runtime/runtime.json
          --output-dir build/partition-study-acceptance
      - name: Verify native partition service and independent statistics
        run: |
          build/worker-ci/test_partition_runtime build/worker-runtime/runtime.json build/native-partition-acceptance
          python tools/check_native_partition.py --study-dir build/native-partition-acceptance/job --output build/native-partition-acceptance/python-parity.json
      - name: Run device response fold acceptance
        shell: pwsh
        run: |
          $taskResponseDirectory = Join-Path $PWD 'build/device-response-acceptance'
          New-Item -ItemType Directory -Path $taskResponseDirectory | Out-Null
          $taskDddRows = [System.Collections.Generic.List[string]]::new()
          $taskSeeRows = [System.Collections.Generic.List[string]]::new()
          $taskHeader = 'device_id,metric,particle,energy_MeV,response,response_unit,angular_basis,reference'
          $taskDddRows.Add($taskHeader)
          $taskSeeRows.Add($taskHeader)
          $taskProject = Get-Content -Raw -Path 'examples/projects/spacecraft-tid-assembly.json' | ConvertFrom-Json
          $taskDeviceIds = [System.Collections.Generic.List[string]]::new()
          foreach ($taskVolume in $taskProject.volumes | Where-Object { $_.sensitive }) { $taskDeviceIds.Add($taskVolume.id) }
          foreach ($taskInstance in $taskProject.instances) {
            $taskTemplate = $taskProject.templates | Where-Object { $_.id -eq $taskInstance.template_id } | Select-Object -First 1
            foreach ($taskVolume in $taskTemplate.volumes | Where-Object { $_.sensitive }) { $taskDeviceIds.Add("$($taskInstance.id)/$($taskVolume.id)") }
          }
          foreach ($taskTarget in $taskDeviceIds) {
            foreach ($taskSpecies in @(@{ name='e-'; low=0.1; high=3 },@{ name='proton'; low=1; high=100 })) {
              foreach ($taskPoint in @(@{e=$taskSpecies.low;r=1.0},@{e=[Math]::Sqrt($taskSpecies.low*$taskSpecies.high);r=2.0},@{e=$taskSpecies.high;r=1.0})) {
                $taskDddRows.Add("$taskTarget,ddd,$($taskSpecies.name),$($taskPoint.e),$($taskPoint.r),MeV_cm2_per_g,isotropic_omnidirectional,synthetic NIEL API contract fixture")
                $taskSeeRows.Add("$taskTarget,see,$($taskSpecies.name),$($taskPoint.e),$($taskPoint.r),cm2_per_device,isotropic_omnidirectional,synthetic cross-section API contract fixture")
              }
            }
          }
          $taskDddRows | Set-Content -LiteralPath (Join-Path $taskResponseDirectory 'ddd.csv') -Encoding utf8
          $taskSeeRows | Set-Content -LiteralPath (Join-Path $taskResponseDirectory 'see.csv') -Encoding utf8
          & build/worker-ci/test_device_response 2>&1 | Tee-Object -FilePath (Join-Path $taskResponseDirectory 'contract.log')
          if ($LASTEXITCODE -ne 0) { throw 'Response fold contract failed' }
          build/worker-ci/spacerad_cli validate --project examples/projects/spacecraft-tid-assembly.json
      - name: Verify real external-ephemeris model and orbit SDK
        run: |
          python -m pip --isolated install --only-binary=:all: spacepy==0.7.0
          python -m pip freeze > build/worker-evidence/orbit-model-packages.txt
          build/worker-ci/test_orbit_runtime "$CONDA_PREFIX/bin/python" "$PWD/tools" "$PWD/examples/ephemerides/synthetic-stationary-geo-km.csv" build/worker-runtime/runtime.json build/orbit-model-acceptance
          python tools/check_ae8ap8_example.py --environment-dir build/orbit-model-acceptance/model/environment > build/orbit-model-acceptance/python-check.json
          cmake --install build/worker-ci --prefix "$PWD/build/native-sdk-stage"
          cmake -E rename build/native-sdk-stage build/native-sdk-relocated
          cmake -S examples/partition-consumer -B build/native-sdk-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/native-sdk-relocated;$CONDA_PREFIX"
          cmake --build build/native-sdk-consumer --parallel 2
          build/native-sdk-consumer/space_rad_consumer build/native-partition-acceptance/job build/orbit-model-acceptance/model build/device-response-acceptance/ddd.csv build/device-response-acceptance/see.csv examples/projects/spacecraft-tid-assembly.json
          cmake -S examples/orbit-consumer -B build/orbit-sdk-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/native-sdk-relocated;$CONDA_PREFIX"
          cmake --build build/orbit-sdk-consumer --parallel 2
          build/orbit-sdk-consumer/orbit_consumer build/orbit-model-acceptance/model
      - name: Verify device folding on an actual AE8 AP8 binned spectrum
        run: |
          for metric in ddd see; do
            archive="build/device-response-acceptance/model-$metric"
            build/worker-ci/spacerad_cli fold-response --project build/orbit-model-acceptance/model/environment/project.json --response "examples/device-response/synthetic-obc-$metric.csv" --output "$archive" > "$archive.ndjson"
            build/worker-ci/spacerad_cli inspect-response --job "$archive" > "$archive/review.ndjson"
            python tools/check_binned_device_response.py "$archive" > "$archive/rational-check.json"
          done

      - name: Preserve logs and numerical evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: worker-linux-evidence
          path: |
            build/worker-evidence/*.txt
            build/worker-evidence/*.json
            build/worker-ci/worker-tests.xml
            build/worker-ci/Testing/Temporary/LastTest.log
            build/worker-ci/radiation-build.json
            build/worker-ci/radiation-datasets.txt
            build/worker-runtime/*.json
            build/worker-acceptance/**/*.json
            build/worker-acceptance/**/*.log
            build/target-fluence-acceptance/**/*.json
            build/target-fluence-acceptance/**/*.csv
            build/target-fluence-acceptance/**/*.ndjson
            build/target-fluence-acceptance/**/*.log
            build/cli-acceptance/**/*.json
            build/cli-acceptance/**/*.log
            build/results-acceptance/**/*.json
            build/results-acceptance/**/*.log
            build/scan-acceptance/**/*.json
            build/scan-acceptance/**/*.log
            build/scan-acceptance/**/*.csv
            build/voxel-acceptance/**/*.json
            build/voxel-acceptance/**/*.log
            build/pstar-acceptance/**/*.json
            build/pstar-acceptance/**/*.log
            build/importance-acceptance/**/*.json
            build/importance-acceptance/**/*.log
            build/energy-response-acceptance/**/*.json
            build/energy-response-acceptance/**/*.log
            build/energy-response-acceptance/*.csv
            build/energy-scaling-acceptance/**/*.json
            build/energy-scaling-acceptance/**/*.log
            build/partition-study-acceptance/**/*.json
            build/partition-study-acceptance/**/*.log
            build/partition-study-acceptance/**/*.csv
            build/partition-study-acceptance/**/*.html
            build/native-partition-acceptance/**/*.json
            build/native-partition-acceptance/**/*.csv
            build/native-partition-acceptance/**/*.log
            build/orbit-model-acceptance/**/*.json
            build/orbit-model-acceptance/**/*.csv
            build/orbit-model-acceptance/**/*.log
            build/device-response-acceptance/**/*
          if-no-files-found: warn
          retention-days: 14
